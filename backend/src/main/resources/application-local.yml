# Development settings, activated automatically by `./mvnw spring-boot:run` (see pom.xml).
# Start the database and Vault first:   docker compose up -d db vault vault-init
# The database credentials and JWT secret then come from that dev Vault, like in Docker; the
# AppRole login (VAULT_ROLE_ID / VAULT_SECRET_ID) is read from the repository's .env file
# (see application.yml). Never used by the packaged jar / Docker image.
spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/cipherchat
