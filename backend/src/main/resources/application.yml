spring:
  application:
    name: cipherchat
  config:
    # Local development only: `./mvnw spring-boot:run` (working directory backend/) reads the AppRole
    # IDs from the repository's .env. In Docker and for a packaged jar the file does not exist there.
    import: optional:file:../.env[.properties]
  cloud:
    vault:
      uri: ${VAULT_URI:http://localhost:8200}
      fail-fast: true
      authentication: APPROLE
      app-role:
        role-id: ${VAULT_ROLE_ID:}
        secret-id: ${VAULT_SECRET_ID:}
      kv:
        enabled: true
        backend: secret
        application-name: cipherchat
        # Read only secret/cipherchat (the policy allows nothing else).
        default-context: ""
        profiles: ""
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/cipherchat}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc.time_zone: UTC
  flyway:
    enabled: true
  servlet:
    multipart:
      # Hard ceiling enforced by the servlet container; the service applies the precise limit.
      max-file-size: 12MB
      max-request-size: 12MB
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    whitelabel:
      enabled: false

app:
  jwt:
    # The signing secret (app.jwt.secret, at least 32 bytes) comes from Vault.
    ttl: ${JWT_TTL:PT12H}
    issuer: cipherchat
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGIN:http://localhost:3000}
  key-backup:
    # Vault Transit key that adds a second lock to the users' passphrase-locked key backups.
    transit-path: transit
    transit-key: cipherchat-key-backup
  attachments:
    dir: ${ATTACHMENTS_DIR:./data/attachments}
    # Plaintext limit is 10 MB (enforced in the browser); allow headroom for OpenPGP framing.
    max-encrypted-bytes: 11010048
  messages:
    max-ciphertext-chars: 200000
  login-rate-limit:
    max-attempts: 5          # failed logins per username per window
    max-attempts-per-ip: 20  # auth requests per client IP per window
    window: PT1M

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

---
# A separate document so the import above is loaded before Vault is contacted.
# Secrets are never in this file or in env files: the JWT signing secret and the database
# credentials (app.jwt.secret, spring.datasource.username/password) are read from Vault KV v2 at
# secret/cipherchat when the app starts. See vault/init.sh and docs/KEY_MANAGEMENT.md.
spring:
  config:
    import: vault://
